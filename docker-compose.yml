name: campinas-news

# O scraper NÃO sobe Postgres próprio: ele usa o banco do clipping-tv
# (schema `sites`). O host vem do .env (POSTGRES_HOST) e a rede externa
# `clipping-tv_default` é anexada para o DNS resolver o container do banco.
#
# Para rodar isolado (dev), use `docker-compose.standalone.yml`, que adiciona
# um Postgres local e não depende da rede do clipping-tv.

x-app-env: &app-env
  env_file:
    - .env

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: campinas-news-scraper:latest
    container_name: campinas-news-worker
    restart: unless-stopped
    <<: *app-env
    command: ["worker"]
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: ${SCRAPER_NETWORK:-clipping-tv_default}
    external: true
